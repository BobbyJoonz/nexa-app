packages:
  - apps/*
  - packages/*
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo-updates@57.0.19
  - expo@57.0.18
# Force a single expo-constants copy: expo-asset declares ~57.0.15 (range
# includes 57.0.16), yet the lockfile nested a 57.0.15 peer-variant alongside
# the project's 57.0.16 — a real duplicate native module per expo-doctor.
overrides:
  expo-constants: 57.0.16
