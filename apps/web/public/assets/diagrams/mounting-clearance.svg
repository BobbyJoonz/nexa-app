    <style>.line{fill:none;stroke:#122C4F;stroke-width:4}.measure{fill:none;stroke:#891525;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.label{fill:#172338;font:600 22px system-ui,sans-serif}.note{fill:#5C6878;font:500 16px system-ui,sans-serif}</style>
  </defs>
  <rect width="760" height="520" rx="28" fill="#F4F6F8"/>
  <path class="line" d="M225 125h310v300H225zM275 125v-45h44v45M441 125V80h44v45"/>
